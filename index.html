
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade Vibes</title>
<link rel="icon" type="image/png" href="icon.png">

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');

:root {
  --ink: #f8f0ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 28px 14px 42px;
  display: flex;
  justify-content: center;
  font-family: 'VT323', monospace;
  color: #fff;
  background:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px),
    radial-gradient(circle at center, #241044, #09051a 85%);
  background-size: 4px 4px, 4px 4px, auto;
}

main {
  width: min(1000px, 100%);
  text-align: center;
}

h1 {
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(23px, 5vw, 42px);
  line-height: 1.6;
  color: #ff4fd8;
  text-shadow:
    3px 3px #5520a0,
    0 0 12px #ff4fd8,
    0 0 25px #ff4fd8;
  letter-spacing: 0;
}

.subtitle {
  max-width: 590px;
  margin: 0 auto 25px;
  color: #d6c8f5;
  line-height: 1.6;
}

.machine {
  position: relative;
  width: min(590px, 100%);
  margin: auto;
  padding: 18px;
  background: #17102e;
  border: 5px solid #38f6ff;
  border-radius: 8px;
  box-shadow:
    0 0 10px #38f6ff,
    0 0 25px #38f6ff66,
    10px 10px 0 #09051a;
}

.header {
  display: flex;
  justify-content: space-between;
  padding: 2px 8px 15px;
  color: #ffe66d;
  font-family: 'Press Start 2P', cursive;
  font-size: 9px;
}

.lights {
  display: flex;
  gap: 7px;
}

.lights i {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #ff4fd8;
  box-shadow: 0 0 12px #ff4fd8;
}

.lights i:nth-child(even) {
  background: #38f6ff;
  box-shadow: 0 0 12px #38f6ff;
}

.display {
  background: #080e1d;
  border: 4px solid #ff4fd8;
  border-radius: 4px;
  padding: 13px;
  margin-bottom: 14px;
  box-shadow: inset 0 0 15px #38f6ff44;
}

.display-message {
  color: #ffe66d;
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(10px, 2vw, 16px);
  line-height: 1.8;
  text-shadow: 0 0 9px #ffe66d;
  margin: 4px 0 0;
  min-height: 29px;
}

.window {
  background: #090d20;
  border: 4px solid #38f6ff;
  border-radius: 4px;
  padding: 16px 12px 10px;
  box-shadow: inset 0 0 18px #38f6ff33;
}

.shelf {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 7px 5px;
}

.item {
  aspect-ratio: 1;
  border: 2px solid #fff;
  border-radius: 4px;
  background: var(--c);
  box-shadow: 0 0 8px #ffffff66;
  display: grid;
  place-items: center;
  font-size: clamp(13px, 2.5vw, 20px);
  font-weight: 1000;
  color: #17102e;
  transition: transform .25s, opacity .25s;
  image-rendering: pixelated;
}

.item.dispensed {
  opacity: .12;
  transform: scale(.5);
}

.slot-label {
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  line-height: 2;
  margin: 11px 0 2px;
}

/* PROGRESS TRACKER */

.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 14px 4px;
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 9px;
  line-height: 1.8;
}

#resetProgress {
  background: #100b25;
  color: #ff4fd8;
  border: 2px solid #ff4fd8;
  padding: 9px 12px;
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  cursor: pointer;
}

#resetProgress:hover {
  background: #ff4fd8;
  color: #100b25;
}

/* PROGRESS BAR */

.progress-track {
  width: 100%;
  height: 8px;
  background: #30204c;
  border: 1px solid #38f6ff;
  margin: 10px 0 14px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: #38f6ff;
  box-shadow: 0 0 10px #38f6ff;
  transition: width .4s ease;
}

.lower {
  display: grid;
  grid-template-columns: 1fr 115px;
  gap: 12px;
  margin-top: 14px;
}

.keypad {
  background: #100b25;
  border: 3px solid #ff4fd8;
  border-radius: 4px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.key {
  background: #241447;
  border: 2px solid #38f6ff;
  border-radius: 3px;
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  padding: 10px 0;
  box-shadow: 0 4px 0 #116a82;
  cursor: pointer;
}

.key:active {
  transform: translateY(3px);
  box-shadow: none;
}

.coin-panel {
  background: #100b25;
  border: 3px solid #ff4fd8;
  border-radius: 4px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.coin {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #ffe66d;
  border: 3px solid #fff;
  box-shadow: 0 0 12px #ffe66d;
  display: grid;
  place-items: center;
  color: #17102e;
}

.coin-label {
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 7px;
  line-height: 1.8;
}

.dispense-row {
  display: flex;
  justify-content: center;
  margin-top: 13px;
}

.dispense {
  background: #ff4fd8;
  color: #160b2c;
  border: 3px solid #fff;
  border-radius: 4px;
  padding: 15px 28px;
  font-family: 'Press Start 2P', cursive;
  font-size: 11px;
  line-height: 1.8;
  box-shadow: 0 5px 0 #92258a, 0 0 15px #ff4fd8;
  cursor: pointer;
}

.dispense:hover {
  background: #ffe66d;
  box-shadow: 0 5px 0 #a87919, 0 0 20px #ffe66d;
}

.dispense:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.music-row {
  position: absolute;
  top: 12px;
  right: 15px;
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 0;
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
}

.music-toggle {
  background: #100b25;
  border: 2px solid #38f6ff;
  border-radius: 4px;
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 9px 12px;
  box-shadow: 0 0 10px #38f6ff66;
  cursor: pointer;
}

.chute {
  height: 67px;
  width: 210px;
  max-width: 75%;
  margin: 13px auto 0;
  background: #080e1d;
  border: 4px solid #ff4fd8;
  border-radius: 4px;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 8px;
  line-height: 1.8;
  box-shadow: inset 0 0 12px #ff4fd844;
}

.capsule {
  font-size: 28px;
  animation: bounce .55s ease-in-out 2;
}

@keyframes bounce {
  50% {
    transform: translateY(-9px) rotate(10deg);
  }
}

.footer {
  font-size: 12px;
  color: #38f6ff;
  margin-top: 17px;
}

/* RESULT POPUP */

.popup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(5, 3, 20, .82);
  backdrop-filter: blur(6px);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 9999;
}

.popup-overlay.show {
  display: flex;
  animation: overlayFade .3s ease;
}

.popup-card {
  position: relative;
  width: min(500px, 100%);
  margin: 0;
  padding: 35px 25px;
  text-align: center;
  background: #100b25;
  border: 3px solid #38f6ff;
  border-radius: 5px;
  box-shadow:
    0 0 12px #38f6ff,
    0 0 30px #ff4fd8,
    inset 0 0 20px #38f6ff22;
  animation: popupZoom .45s cubic-bezier(.17,.89,.32,1.4);
}

.kicker {
  color: #38f6ff;
  font-family: 'Press Start 2P', cursive;
  font-size: 9px;
  line-height: 1.8;
  letter-spacing: .14em;
}

.result h2 {
  color: #ffe66d;
  font-family: 'Press Start 2P', cursive;
  font-size: clamp(13px, 2.5vw, 20px);
  line-height: 1.8;
  margin: 9px 0 10px;
  overflow-wrap: anywhere;
}

.result p {
  color: #d6c8f5;
  font-size: 22px;
  line-height: 1.6;
  margin: 0 0 16px;
}

.visit {
  display: none;
  text-decoration: none;
  background: #ff4fd8;
  color: #160b2c;
  border: 2px solid white;
  border-radius: 4px;
  padding: 11px 17px;
  font-family: 'Press Start 2P', cursive;
  font-size: 12px;
  line-height: 1.8;
}

.visit.show {
  display: inline-block;
}

.popup-close {
  position: absolute;
  top: 10px;
  right: 12px;
  background: transparent;
  border: 2px solid #ff4fd8;
  color: #ff4fd8;
  font-size: 17px;
  font-weight: bold;
  padding: 5px 9px;
  cursor: pointer;
  font-family: 'Press Start 2P', cursive;
}

.popup-close:hover {
  background: #ff4fd8;
  color: #100b25;
}

@keyframes popupZoom {
  0% {
    opacity: 0;
    transform: scale(.3) rotate(-8deg);
  }
  70% {
    opacity: 1;
    transform: scale(1.08) rotate(2deg);
  }
  100% {
    transform: scale(1) rotate(0);
  }
}

@keyframes overlayFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

body:has(.popup-overlay.show) {
  overflow: hidden;
}

@media(max-width:480px) {
  .machine {
    padding: 12px;
  }

  .shelf {
    gap: 5px 3px;
  }

  .window {
    padding: 12px 7px 8px;
  }

  .lower {
    grid-template-columns: 1fr 88px;
  }

  .keypad {
    padding: 8px;
    gap: 5px;
  }

  .key {
    padding: 9px 0;
  }

  .music-row {
    top: 9px;
    right: 9px;
  }

  .music-toggle {
    font-size: 7px;
    padding: 7px;
  }

  .progress-row {
    font-size: 7px;
  }

  #resetProgress {
    font-size: 7px;
    padding: 7px;
  }
}
</style>
</head>

<body>
<main>

<h1>Mystery Vending Machine</h1>
<br><br>

<section class="machine">

<div class="header">
  <span class="lights">
    <i></i><i></i><i></i><i></i><i></i>
  </span>
</div>

<div class="display">
  <div class="display-message" id="machineMessage">
    READY TO SURPRISE YOU!
  </div>
</div>

<div class="window">
  <div class="shelf" id="shelf"></div>
  <div class="slot-label">MYSTERY ITEMS</div>
</div>

<!-- PROGRESS TRACKER -->

<div class="progress-row">
  <span id="progressCount">0 / 27 REVEALED</span>
  <button id="resetProgress">RESET MACHINE ↻</button>
</div>

<div class="progress-track">
  <div class="progress-fill" id="progressFill"></div>
</div>

<div class="lower">

  <div class="keypad">
    <button class="key">1</button>
    <button class="key">2</button>
    <button class="key">3</button>
    <button class="key">4</button>
    <button class="key">5</button>
    <button class="key">6</button>
    <button class="key">7</button>
    <button class="key">0</button>
    <button class="key">9</button>
  </div>

  <div class="coin-panel">
    <div class="coin">★</div>
    <div class="coin-label">VIRTUAL<br>COIN SLOT</div>
    <div>⬇️</div>
  </div>

</div>

<div class="dispense-row">
  <button class="dispense" id="dispense">
    INSERT COIN & DISPENSE
  </button>
</div>

<div class="music-row">
  <button class="music-toggle" id="musicToggle">
    ♫ Turn music on
  </button>
</div>

<div class="chute" id="chute">
  PRIZE COLLECTION
</div>

</section>

<!-- RESULT POPUP -->

<div class="popup-overlay" id="resultPopup">

  <section class="result popup-card" aria-live="polite">

    <button class="popup-close" id="closePopup">✕</button>

    <div class="kicker">★ YOUR MYSTERY ITEM ★</div>

    <h2 id="resultTitle">Nothing revealed… yet!</h2>

    <p id="resultDesc">
      Insert a virtual coin and let the machine choose a surprise for you.
    </p>

    <a class="visit" id="visit" href="#"
       target="_blank" rel="noopener noreferrer">
      Visit website ↗
    </a>

  </section>

</div>

<p class="footer"></p>

</main>

<script>

// ALL 27 MYSTERY PRIZES

const prizes = [

{kind:'site',name:'The Little Daily',url:'https://thelittledaily.com/'},

{kind:'site',name:'Consult Your Guardian Angel',url:'https://www.consultyourguardianangel.com/'},

{kind:'site',name:'Histography',url:'https://histography.io/'},

{kind:'site',name:'Floor 796',url:'https://floor796.com/'},

{kind:'site',name:'Windows 93',url:'https://www.windows93.net/'},

{kind:'site',name:"Anna's Garden",url:'https://annasgarden.vercel.app/'},

{kind:'site',name:'The Useless Web',url:'https://theuselessweb.com/'},

{kind:'site',name:'Gradient Horse',url:'https://gradient.horse/'},

{kind:'site',name:'Window Swap',url:'https://www.window-swap.com/homebg.bdedf07b6de502dd8e8a.gif'},

{kind:'site',name:'Neal.fun',url:'https://neal.fun/'},

{kind:'site',name:'A Soft Murmur',url:'https://asoftmurmur.com/'},

{kind:'site',name:'Slow Roads',url:'https://slowroads.io/'},

{kind:'site',name:'Murdle',url:'https://murdle.com/'},

{kind:'site',name:'Messenger',url:'https://messenger.abeto.co/'},

{kind:'site',name:'Roombox Design',url:'https://www.crazygames.com/game/roombox-design?utm_source=Pinterest&utm_medium=organic'},

{kind:'site',name:'Narinig Mo Ba',url:'https://doppie.itch.io/narinig-mo-ba'},

{kind:'site',name:'Cook',url:'https://r74n.com/cook/?utm_source=Pinterest&utm_medium=organic'},

{kind:'site',name:'Palm Cracker',url:'https://gamaverse.com/palm-cracker-game/?utm_source=Pinterest&utm_medium=organic#google_vignette'},

{kind:'quote',name:"Life is like a door, never trust a cow because the sun can't swim."},

{kind:'quote',name:'Whatever life throws at you, duck and let it hit someone else.'},

{kind:'quote',name:'I failed as a person… I am a dinosaur now.'},

{kind:'quote',name:'When nothing goes right… GO LEFT!!'},

{kind:'quote',name:'Today todayed the today out of me.'},

{kind:'quote',name:"Due to personal reasons, I'm evil now…"},

{kind:'quote',name:'Hocus Pocus, you lost your focus.'},

{kind:'quote',name:'I send you luck in a form of duck.'},

{kind:'quote',name:'A wise man once said nothing.'}

];

// SHUFFLE PRIZES

for(let i=prizes.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [prizes[i],prizes[j]]=[prizes[j],prizes[i]];
}

// COLORS

const colors=[
  '#ff9fbd',
  '#ffd978',
  '#8fe1ee',
  '#b9a0ff',
  '#a9e7bd',
  '#ffc18b',
  '#f5a9e6'
];

const shelf=document.getElementById('shelf');
const progressCount=document.getElementById('progressCount');
const progressFill=document.getElementById('progressFill');

const button=document.getElementById('dispense');
const message=document.getElementById('machineMessage');
const chute=document.getElementById('chute');

const resetProgress=document.getElementById('resetProgress');

const resultPopup=document.getElementById('resultPopup');

const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));

// LOAD SAVED PROGRESS

let revealedPrizes=[];

try {
  revealedPrizes=JSON.parse(
    localStorage.getItem('revealedPrizes') || '[]'
  );

  if(!Array.isArray(revealedPrizes)){
    revealedPrizes=[];
  }

} catch(error) {
  revealedPrizes=[];
}

// REMOVE INVALID ENTRIES

const validNames=new Set(prizes.map(prize=>prize.name));

revealedPrizes=revealedPrizes.filter(
  name=>validNames.has(name)
);

let revealedSet=new Set(revealedPrizes);

// FIND REMAINING PRIZES

let remaining=prizes
  .map((prize,index)=>({prize,index}))
  .filter(item=>!revealedSet.has(item.prize.name))
  .map(item=>item.index);

let busy=false;

// UPDATE PROGRESS

function updateProgress(){

  const revealed=revealedSet.size;
  const total=prizes.length;
  const percentage=(revealed/total)*100;

  progressCount.textContent=
    `${revealed} / ${total} REVEALED`;

  progressFill.style.width=`${percentage}%`;
}

// SAVE PROGRESS

function saveProgress(){

  try {
    localStorage.setItem(
      'revealedPrizes',
      JSON.stringify([...revealedSet])
    );
  } catch(error) {
    console.warn('Could not save progress:',error);
  }

}

// CREATE MYSTERY CAPSULES

prizes.forEach((prize,i)=>{

  const el=document.createElement('div');

  el.className='item';
  el.textContent='?';

  el.style.setProperty(
    '--c',
    colors[i%colors.length]
  );

  if(revealedSet.has(prize.name)){
    el.classList.add('dispensed');
  }

  shelf.appendChild(el);

});

// INITIAL PROGRESS

updateProgress();

// HANDLE ALREADY COMPLETED MACHINE

function checkSoldOut(){

  if(remaining.length===0){

    button.disabled=true;
    button.textContent='ALL 27 PRIZES REVEALED!';
    message.textContent='YOU FOUND EVERYTHING!';

  } else {

    button.disabled=false;
    button.textContent=
      `INSERT COIN & DISPENSE (${remaining.length} LEFT)`;

  }

}

checkSoldOut();

// POPUP CLOSE BUTTON

document.getElementById('closePopup').addEventListener('click',()=>{
  resultPopup.classList.remove('show');
});

// CLOSE POPUP WHEN CLICKING OUTSIDE

resultPopup.addEventListener('click',(e)=>{

  if(e.target===resultPopup){
    resultPopup.classList.remove('show');
  }

});

// DISPENSE PRIZE

button.addEventListener('click',async()=>{

  if(busy || !remaining.length) return;

  busy=true;
  button.disabled=true;

  document.getElementById('resultTitle').textContent=
    'The machine is choosing…';

  document.getElementById('resultDesc').textContent=
    'Something mysterious is on its way down the chute.';

  const visit=document.getElementById('visit');

  visit.classList.remove('show');
  visit.href='#';

  message.textContent='COIN ACCEPTED…';
  chute.textContent='PROCESSING…';

  await wait(650);

  message.textContent='SELECTING YOUR SURPRISE…';

  await wait(850);

  // PICK RANDOM REMAINING PRIZE

  const at=Math.floor(Math.random()*remaining.length);

  const idx=remaining[at];

  const el=shelf.children[idx];

  el.classList.add('dispensed');

  chute.innerHTML='<span class="capsule">🎁</span>';

  await wait(950);

  const prize=prizes[idx];

  // SHOW PRIZE RESULT

  document.getElementById('resultTitle').textContent=
    prize.kind==='site'
      ? prize.name
      : 'A mystery quote!';

  document.getElementById('resultDesc').textContent=
    prize.kind==='site'
      ? 'Your surprise is a website! Open it and see what you discover.'
      : '“'+prize.name+'”';

  if(prize.kind==='site'){

    visit.href=prize.url;
    visit.classList.add('show');

  }

  // SHOW POPUP FOR BOTH TYPES OF PRIZES

  resultPopup.classList.add('show');

  // REMOVE FROM REMAINING PRIZES

  remaining.splice(at,1);

  // SAVE REVEALED PRIZE IN LOCAL STORAGE

  revealedSet.add(prize.name);

  saveProgress();

  // UPDATE PROGRESS COUNTER

  updateProgress();

  message.textContent='SURPRISE DISPENSED!';

  chute.innerHTML='<span class="capsule">✨</span>';

  // CHECK IF ALL PRIZES HAVE BEEN REVEALED

  if(!remaining.length){

    button.textContent='ALL 27 PRIZES REVEALED!';

    message.textContent='YOU FOUND EVERYTHING!';

  } else {

    button.textContent=
      `INSERT COIN & DISPENSE (${remaining.length} LEFT)`;

    button.disabled=false;

  }

  busy=false;

});

// RESET MACHINE

resetProgress.addEventListener('click',()=>{

  if(busy) return;

  const confirmed=confirm(
    'Are you sure you want to reset all revealed prizes?'
  );

  if(!confirmed) return;

  // CLEAR LOCAL STORAGE

  localStorage.removeItem('revealedPrizes');

  // CLEAR REVEALED HISTORY

  revealedSet.clear();

  // RESTORE ALL PRIZES

  remaining=prizes.map((_,index)=>index);

  // RESTORE CAPSULES

  Array.from(shelf.children).forEach(el=>{
    el.classList.remove('dispensed');
  });

  // RESET DISPLAY

  updateProgress();

  message.textContent='READY TO SURPRISE YOU!';

  chute.textContent='PRIZE COLLECTION';

  // RESET BUTTON

  button.disabled=false;

  button.textContent='INSERT COIN & DISPENSE';

  // CLOSE POPUP

  resultPopup.classList.remove('show');

  document.getElementById('resultTitle').textContent=
    'Nothing revealed… yet!';

  document.getElementById('resultDesc').textContent=
    'Insert a virtual coin and let the machine choose a surprise for you.';

  const visit=document.getElementById('visit');

  visit.classList.remove('show');
  visit.href='#';

});

// BACKGROUND MUSIC

const musicToggle=document.getElementById('musicToggle');

const audio=new Audio('bg-music.mp3');

audio.loop=true;
audio.volume=0.4;

let musicOn=false;

musicToggle.addEventListener('click',async()=>{

  if(musicOn){

    audio.pause();

    musicOn=false;

    musicToggle.textContent='♫ Turn music on';

  } else {

    try {

      await audio.play();

      musicOn=true;

      musicToggle.textContent='♫ Turn music off';

    } catch(error) {

      musicToggle.textContent='♫ Tap to try again';

    }

  }

});

</script>

</body>
</html>
